# Pipeline for a uBixCore host project (from the ubixsys/ubixcore skeleton) (2026-08-27, ci-parity
# slice 1): build → lint-and-test → deploy → notify. Notifications go to Discord
# (#<project>-ops / #<project>-alerts) via bin/lib/notify.sh, which reads the
# webhooks from ubixvault with the read-only CI tokens UBIXVAULT_CI_TOKEN_DEV /
# UBIXVAULT_CI_TOKEN_PROD (this project's own read-only tokens, secret/<project>/*) (masked GitLab variables).
#
# lint-and-test is BLOCKING (gate green 2026-08-28: phpcs 0, phpstan 0, 259 tests;
# eslint 0, prettier clean, svelte-check 0 errors).

# Auto-retry: every job retries twice on infrastructure-class failures so a
# runner hiccup never needs a human click; build jobs also retry script
# failures (registry/network blips during docker push present as those).
# Genuine red stays red — lint/test jobs do not retry script failures.
default:
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - scheduler_failure
      - unknown_failure

stages:
  - test
  - build
  - lint-and-test
  - deploy
  - promote
  - notify

.registry_login:
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY

# ---------------------------------------------------------------------------
# build
# ---------------------------------------------------------------------------
# Runtime image (multi-arch, `:<ref>` mutable tag + `:<ref>-<sha>` immutable),
# and a `-test` image layered on it (amd64 only — it never deploys).
.build:
  extends: .registry_login
  stage: build
  tags: [shell]
  retry:
    max: 2
    when:
      - script_failure
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - scheduler_failure
      - unknown_failure
  script:
    - |
      set -euo pipefail
      RUNTIME_REF="${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}"
      RUNTIME_SHA_REF="${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHA}"
      TEST_REF="${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHA}-test"

      # uBixCore comes from the private ubixsys group Composer registry. Auth is a
      # BuildKit secret (never a layer): a deploy token from uBixVault
      # (secret/<project>/composer: username + token, read_package_registry) if present,
      # else this job's CI_JOB_TOKEN (needs this project on ubixcore's job-token allowlist).
      SCRIPT_DIR="$CI_PROJECT_DIR"; . bin/lib/notify.sh
      CU="$(vault_kv composer username)"; CT="$(vault_kv composer token)"
      if [ -n "$CT" ]; then AUTH_USER="$CU"; AUTH_TOKEN="$CT"; else AUTH_USER="gitlab-ci-token"; AUTH_TOKEN="$CI_JOB_TOKEN"; fi
      AUTH_FILE="$(mktemp)"; trap 'rm -f "$AUTH_FILE"' EXIT
      printf '{"gitlab-token":{"%s":{"username":"%s","token":"%s"}}}' "$CI_SERVER_HOST" "$AUTH_USER" "$AUTH_TOKEN" > "$AUTH_FILE"
      docker buildx build --provenance=false --sbom=false --platform linux/amd64,linux/arm64 --push \
        --secret id=composer_auth,src="$AUTH_FILE" \
        -t "$RUNTIME_REF" -t "$RUNTIME_SHA_REF" -f "$RUNTIME_DOCKERFILE" .
      docker buildx build --provenance=false --sbom=false --platform linux/amd64 --push \
        --build-arg RUNTIME_IMAGE="$RUNTIME_SHA_REF" \
        -t "$TEST_REF" -f Dockerfile_Test .

build-dev:
  extends: .build
  variables: { RUNTIME_DOCKERFILE: Dockerfile }
  only: [dev]

build-staging:
  extends: .build
  variables: { RUNTIME_DOCKERFILE: Dockerfile_Staging }
  only: [staging]

build-main:
  extends: .build
  variables: { RUNTIME_DOCKERFILE: Dockerfile_Main }
  only: [main, master]

# ---------------------------------------------------------------------------
# lint-and-test
# ---------------------------------------------------------------------------
.static_checks:
  extends: .registry_login
  stage: lint-and-test
  tags: [shell]
  timeout: 15 minutes
  script:
    - |
      docker run --rm --workdir /web \
        "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA-test" \
        sh -c "set -e && vendor/bin/phpcs --no-cache && vendor/bin/phpstan analyse --no-progress --memory-limit=2G app bin php public tests"

# PHPUnit against the unit-test MariaDB (a MariaDB reachable from the
# runner, docker-bridge IP only). Credentials come from ubixvault
# secret/<project>/test-db via the branch's read-only CI token (CP-04).
.phpunit:
  extends: .registry_login
  stage: lint-and-test
  tags: [shell]
  timeout: 30 minutes
  script:
    - |
      set -u; SCRIPT_DIR="$CI_PROJECT_DIR"; . bin/lib/notify.sh
      export TEST_MYSQL_WRITE_HOST="$(vault_kv test-db host)" TEST_MYSQL_WRITE_PORT="$(vault_kv test-db port)"
      export TEST_MYSQL_WRITE_USERNAME="$(vault_kv test-db username)" TEST_MYSQL_WRITE_PASSWORD="$(vault_kv test-db password)"
      export TEST_MYSQL_WRITE_DATABASE="$(vault_kv test-db database)"
      [ -n "$TEST_MYSQL_WRITE_HOST" ] || { echo "no test-db credentials from vault (secret/<project>/test-db)"; exit 1; }
      docker run --rm --workdir /web \
        -e TEST_MYSQL_WRITE_HOST -e TEST_MYSQL_WRITE_PORT -e TEST_MYSQL_WRITE_DATABASE \
        -e TEST_MYSQL_WRITE_USERNAME -e TEST_MYSQL_WRITE_PASSWORD \
        "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA-test" \
        sh -c "set -e && { [ -f /web/.env ] && sed -i 's/^TEST_MYSQL_/#&/' /web/.env || true; } \\
          && php bin/ubix database:resetSchema test -n \\
          && mysql -h \$TEST_MYSQL_WRITE_HOST -P \$TEST_MYSQL_WRITE_PORT -u \$TEST_MYSQL_WRITE_USERNAME -p\$TEST_MYSQL_WRITE_PASSWORD -e 'CREATE DATABASE IF NOT EXISTS SYSTEMS' \\
          && php bin/ubix migrate:up --target=test --yes -n \\
          && vendor/bin/phpunit"

static-checks-dev: { extends: .static_checks, only: [dev] }
phpunit-dev:       { extends: .phpunit,       only: [dev] }
static-checks-staging: { extends: .static_checks, only: [staging] }
phpunit-staging:       { extends: .phpunit,       only: [staging] }

# ---------------------------------------------------------------------------
# deploy
# ---------------------------------------------------------------------------
# bin/deploy.sh posts its own success/failure note to #ubixcore-ops.
.deploy:
  stage: deploy
  tags: [shell]
  script:
    - bash bin/deploy.sh $CI_COMMIT_REF_SLUG

deploy-dev:     { extends: .deploy, only: [dev],          environment: { name: dev } }
deploy-staging: { extends: .deploy, only: [staging],      environment: { name: staging } }
deploy-main:    { extends: .deploy, only: [main, master], environment: { name: main } }

# ---------------------------------------------------------------------------
# promote — dev → staging → main, automatic after a green deploy (auto-to-main
# until the platform is live; CP-09). bin/promote.sh halts on a Destructive:
# migration; the *-destructive manual jobs acknowledge and proceed.
# Needs the GITLAB_PROMOTE_TOKEN CI variable.
# ---------------------------------------------------------------------------
.promote:
  stage: promote
  tags: [shell]
  variables: { GIT_DEPTH: "0" }

promote-to-staging:
  extends: .promote
  needs: [{ job: deploy-dev, artifacts: false }]
  rules: [{ if: '$CI_COMMIT_BRANCH == "dev"', when: on_success }]
  script: [bash bin/promote.sh staging]

promote-to-staging-destructive:
  extends: .promote
  needs: [{ job: deploy-dev, artifacts: false }]
  rules: [{ if: '$CI_COMMIT_BRANCH == "dev"', when: manual, allow_failure: true }]
  variables: { GIT_DEPTH: "0", PROMOTE_ACK_DESTRUCTIVE: "1" }
  script: [bash bin/promote.sh staging]

promote-to-main:
  extends: .promote
  needs: [{ job: deploy-staging, artifacts: false }]
  rules: [{ if: '$CI_COMMIT_BRANCH == "staging"', when: on_success }]
  script: [bash bin/promote.sh main]

promote-to-main-destructive:
  extends: .promote
  needs: [{ job: deploy-staging, artifacts: false }]
  rules: [{ if: '$CI_COMMIT_BRANCH == "staging"', when: manual, allow_failure: true }]
  variables: { GIT_DEPTH: "0", PROMOTE_ACK_DESTRUCTIVE: "1" }
  script: [bash bin/promote.sh main]

# ---------------------------------------------------------------------------
# notify — red pipeline → #<project>-alerts
# ---------------------------------------------------------------------------
.notify_failure:
  stage: notify
  tags: [shell]
  timeout: 5 minutes
  when: on_failure
  script:
    - |
      set -u
      SCRIPT_DIR="$CI_PROJECT_DIR"; . bin/lib/notify.sh
      WHO="${GITLAB_USER_NAME:-${GITLAB_USER_LOGIN:-unknown}}"
      TEXT="Branch: ${CI_COMMIT_REF_NAME} — pushed by ${WHO}
      Commit: [${CI_COMMIT_TITLE:-$CI_COMMIT_SHORT_SHA}](${CI_PROJECT_URL}/-/commit/${CI_COMMIT_SHA}) (${CI_COMMIT_SHORT_SHA})
      Author: ${CI_COMMIT_AUTHOR:-unknown}
      Pipeline: ${CI_PIPELINE_URL}"
      discord alerts 15158332 "🔴 Pipeline FAILED" "$TEXT"
      exit 0

notify-failure-dev:     { extends: .notify_failure, only: [dev] }
notify-failure-staging: { extends: .notify_failure, only: [staging] }
notify-failure-main:    { extends: .notify_failure, only: [main, master] }
